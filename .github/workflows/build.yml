name: Build APK and EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check project files
        shell: bash
        run: |
          for f in package.json capacitor.config.json www/index.html electron/main.js; do
            if [ ! -f "$f" ]; then echo "::error::$f is missing at the repository root. Upload the CONTENTS of the registry-calculator-app folder to the root of the repository, not the folder itself."; exit 1; fi
          done
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install packages
        run: npm install
      - name: Add Android project
        run: npx cap add android
      - name: Generate icons
        run: npx capacitor-assets generate --android
      - name: Sync web files
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Registry-Calculator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check project files
        shell: bash
        run: |
          for f in package.json capacitor.config.json www/index.html electron/main.js; do
            if [ ! -f "$f" ]; then echo "::error::$f is missing at the repository root. Upload the CONTENTS of the registry-calculator-app folder to the root of the repository, not the folder itself."; exit 1; fi
          done
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install packages
        run: npm install
      - name: Build EXE
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Registry-Calculator-EXE
          path: |
            dist/*.exe
